name: NEPK v1.1 Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/nepk-v1-1-evidence"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.5.2

      - name: Install ARM compiler and H.264 tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi ffmpeg

      - name: Install Python verifier dependency
        run: python -m pip install --disable-pip-version-check cryptography==48.0.0

      - name: Prepare browser test dependencies
        run: |
          pnpm --dir tests/line-crossing-ui install --frozen-lockfile --ignore-scripts
          npm ci --prefix tests/line-crossing-ui/browser-runner --ignore-scripts
          npx --yes playwright@1.64.0 install --with-deps chromium

      - name: Build real Line Crossing v4 ELF
        run: |
          make -C apps/line-crossing/app elf-v4 V4_APP_VERSION=4.0.0
          sha256sum apps/line-crossing/app/build/lc-line-crossing-v4.elf > "$RUNNER_TEMP/nepk-v1-1-evidence/real-elf-sha256.txt"

      - name: Run UI, H.264, runtime, bridge, and NEPK positive and negative acceptance
        shell: bash
        run: |
          set -o pipefail
          export LC_SAVE_DIAGNOSTIC_MODE=matrix
          export LC_SAVE_EVIDENCE_PATH="$RUNNER_TEMP/nepk-v1-1-evidence/line-save-diagnostics.json"
          pnpm --dir tests/line-crossing-ui test 2>&1 | tee "$RUNNER_TEMP/nepk-v1-1-evidence/ui-runtime-bridge.log"
          python -m unittest discover -s tests/nepk-v1_1 -v 2>&1 | tee "$RUNNER_TEMP/nepk-v1-1-evidence/nepk-positive-negative.log"

      - name: Build and independently verify transient TEST ONLY package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/nepk-v1-1-transient"
          evidence_dir="$RUNNER_TEMP/nepk-v1-1-evidence"
          mkdir -m 700 -p "$private_dir"
          python - "$private_dir" "$evidence_dir/trust.json" "$evidence_dir/test-only-key.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec

          private_dir = Path(sys.argv[1])
          key = ec.derive_private_key(1, ec.SECP256R1())
          spki = key.public_key().public_bytes(
              serialization.Encoding.DER,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          fingerprint = hashlib.sha256(spki).hexdigest()
          key_path = private_dir / "test-only.pem"
          key_path.write_bytes(key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          ))
          key_path.chmod(0o600)
          Path(sys.argv[2]).write_text(json.dumps({
              "version": 1,
              "publishers": {
                  "test-publisher": {
                      "spki_der_hex": spki.hex(),
                      "spki_sha256": fingerprint,
                  }
              },
          }, sort_keys=True) + "\n", encoding="utf-8")
          Path(sys.argv[3]).write_text(json.dumps({
              "artifact_type": "TEST ONLY transient verification package",
              "private_key_included": False,
              "publisher_id": "test-publisher",
              "publisher_spki_sha256": fingerprint,
          }, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python package/vnext/nepk_v1_1_pack.py \
            --mode test-only \
            --test-only-key-profile public-d1 \
            --elf apps/line-crossing/app/build/lc-line-crossing-v4.elf \
            --ui-assets tests/line-crossing-ui/.build/production \
            --key "$private_dir/test-only.pem" \
            --out "$private_dir/line-crossing-test-only.neapp" \
            --provenance-out "$private_dir/provenance.json" \
            --publisher-id test-publisher \
            --app-id line-crossing \
            --native-version 4.0.0 \
            --ui-version 1.0.0 \
            --release-seq 1 \
            --source-commit "$GITHUB_SHA"
          python package/vnext/nepk_v1_1_verify.py \
            --bundle "$private_dir/line-crossing-test-only.neapp" \
            --trust "$evidence_dir/trust.json" \
            --expect-publisher-id test-publisher \
            --expect-app-id line-crossing \
            --compact > "$evidence_dir/test-only-package-verification.json"
          sha256sum "$private_dir/line-crossing-test-only.neapp" > "$evidence_dir/test-only-package-sha256.txt"
          python - "$evidence_dir/test-only-package-verification.json" "$evidence_dir/test-only-package-sha256.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("result") != "PASS":
              raise SystemExit("transient TEST ONLY NEPK package failed independent verification")
          Path(sys.argv[1]).write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Record verification run metadata
        if: always()
        env:
          VERIFICATION_RESULT: ${{ job.status }}
        run: |
          python - "$RUNNER_TEMP/nepk-v1-1-evidence/ci-summary.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "workflow": "NEPK v1.1 Verification",
              "result": os.environ["VERIFICATION_RESULT"],
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "no_production_secret": True,
              "installable_neapp_artifact_uploaded": False,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nepk-v1.1-verification-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nepk-v1-1-evidence/*.json
            ${{ runner.temp }}/nepk-v1-1-evidence/*.log
            ${{ runner.temp }}/nepk-v1-1-evidence/*.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
