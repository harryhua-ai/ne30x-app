name: NEPK v1.1 Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.0
        required: true
        type: string

permissions: {}

concurrency:
  group: nepk-oneclick-production
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check cryptography==48.0.0

      - name: Validate the release version
        shell: bash
        run: |
          set -euo pipefail
          python - "$RELEASE_VERSION" <<'PY'
          import sys
          sys.path.insert(0, "package/vnext")
          from nepk_v1_1_release import parse_dispatch_version
          print(parse_dispatch_version(sys.argv[1]))
          PY

      - name: Check exact main SHA, accepted verification run, and production Environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf '%s\n' 'Production release dispatch must target refs/heads/main.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/main" > "$RUNNER_TEMP/main-commit.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nepk_v1_1.yml/runs?branch=main&head_sha=$GITHUB_SHA&status=completed&per_page=100" > "$RUNNER_TEMP/verification-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$RUNNER_TEMP/production-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/production-branch-policies.json"
          python - "$RUNNER_TEMP/main-commit.json" "$RUNNER_TEMP/verification-runs.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          main_sha = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("sha")
          if main_sha != os.environ["GITHUB_SHA"]:
              raise SystemExit("workflow SHA is not the current main SHA")
          runs = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8")).get("workflow_runs", [])
          accepted = [
              run for run in runs
              if run.get("head_sha") == main_sha
              and run.get("head_branch") == "main"
              and run.get("name") == "NEPK v1.1 Verification"
              and run.get("event") in {"push", "workflow_dispatch"}
              and run.get("status") == "completed"
          ]
          if not accepted:
              raise SystemExit("no completed verification run exists for this exact main SHA")
          latest = max(accepted, key=lambda run: (run.get("run_number", 0), run.get("run_attempt", 0), run.get("created_at", "")))
          if latest.get("conclusion") != "success":
              raise SystemExit("latest verification run for this main SHA did not succeed")
          PY
          python package/vnext/nepk_v1_1_release.py check-environment \
            --environment "$RUNNER_TEMP/production-environment.json" \
            --branch-policies "$RUNNER_TEMP/production-branch-policies.json"

  release:
    needs: preflight
    if: needs.preflight.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      NEPK_PRODUCTION_SEQUENCE_LEDGER_GENESIS_SHA256: ${{ vars.NEPK_PRODUCTION_SEQUENCE_LEDGER_GENESIS_SHA256 }}
      NEPK_PRODUCTION_PUBLISHER_ID: ${{ vars.NEPK_PRODUCTION_PUBLISHER_ID }}
      NEPK_PRODUCTION_SPKI_DER_HEX: ${{ vars.NEPK_PRODUCTION_SPKI_DER_HEX }}
      NEPK_PRODUCTION_SPKI_SHA256: ${{ vars.NEPK_PRODUCTION_SPKI_SHA256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.5.2

      - name: Install ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Install Python verifier dependency
        run: python -m pip install --disable-pip-version-check cryptography==48.0.0

      - name: Prepare production UI build dependencies
        run: |
          pnpm --dir tests/line-crossing-ui install --frozen-lockfile --ignore-scripts
          npm ci --prefix tests/line-crossing-ui/browser-runner --ignore-scripts

      - name: Recheck source, accepted verification run, and Environment after approval
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf '%s\n' 'Production release job is restricted to main.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/main" > "$RUNNER_TEMP/main-commit.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nepk_v1_1.yml/runs?branch=main&head_sha=$GITHUB_SHA&status=completed&per_page=100" > "$RUNNER_TEMP/verification-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/production" > "$RUNNER_TEMP/production-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/production-branch-policies.json"
          python - "$RUNNER_TEMP/main-commit.json" "$RUNNER_TEMP/verification-runs.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          main_sha = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("sha")
          if main_sha != os.environ["GITHUB_SHA"]:
              raise SystemExit("main advanced after preflight; refusing to sign another SHA")
          runs = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8")).get("workflow_runs", [])
          accepted = [
              run for run in runs
              if run.get("head_sha") == main_sha
              and run.get("head_branch") == "main"
              and run.get("name") == "NEPK v1.1 Verification"
              and run.get("event") in {"push", "workflow_dispatch"}
              and run.get("status") == "completed"
          ]
          if not accepted:
              raise SystemExit("no completed verification run exists for this exact main SHA")
          latest = max(accepted, key=lambda run: (run.get("run_number", 0), run.get("run_attempt", 0), run.get("created_at", "")))
          if latest.get("conclusion") != "success":
              raise SystemExit("latest verification run for this main SHA did not succeed")
          PY
          python package/vnext/nepk_v1_1_release.py check-environment \
            --environment "$RUNNER_TEMP/production-environment.json" \
            --branch-policies "$RUNNER_TEMP/production-branch-policies.json"
          python - "$RELEASE_VERSION" <<'PY'
          import sys
          sys.path.insert(0, "package/vnext")
          from nepk_v1_1_release import parse_dispatch_version
          print(parse_dispatch_version(sys.argv[1]))
          PY

      - name: Build, sign, verify, and publish the approved version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEPK_PRODUCTION_ISSUER_KEY: ${{ secrets.NEPK_PRODUCTION_ISSUER_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/nepk-release-evidence"
          python scripts/nepk_v1_1_production_release.py release \
            --version "$RELEASE_VERSION" \
            --evidence "$RUNNER_TEMP/nepk-release-evidence/release-evidence.json" \
            --repository "$GITHUB_REPOSITORY"

      - name: Upload non-secret release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nepk-v1.1-production-evidence-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nepk-release-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
