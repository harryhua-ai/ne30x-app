          before=$(git ls-remote origin "$ref")
          [[ "$before" =~ ^[0-9a-f]{40}[$'\t']refs/ght/runtime/[0-9a-f]{64}$ ]] || { echo "Capsule ref is absent or ambiguous" >&2; exit 1; }
          want=${before%%$'\t'*}
          tmpref="refs/ght/tmp/workflow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-plan"
          trap 'git update-ref -d "$tmpref" 2>/dev/null || true' EXIT
          git fetch --force --no-tags origin "+$ref:$tmpref"
          got=$(git rev-parse "$tmpref^{commit}")
          [ "$got" = "$want" ] || { echo "Capsule object changed" >&2; exit 1; }
          capsule_dir=$(mktemp -d "$RUNNER_TEMP/ght-capsule.XXXXXXXX")
          git show "$tmpref:runtime.zip" > "$capsule_dir/runtime.zip"
          git show "$tmpref:MANIFEST.json" > "$capsule_dir/MANIFEST.json"
          after=$(git ls-remote origin "$ref")
          [ "$before" = "$after" ] || { echo "Capsule ref moved during read" >&2; exit 1; }
          python3 - "$capsule_dir" "$GHT_RUNTIME_REF" <<'PY'
          import hashlib, json, pathlib, re, stat, sys, zipfile
          root, pin = pathlib.Path(sys.argv[1]), sys.argv[2]
          payload = (root / "runtime.zip").read_bytes()
          if hashlib.sha256(payload).hexdigest() != pin:
              raise SystemExit("Capsule ZIP digest does not match immutable pin")
          manifest = json.loads((root / "MANIFEST.json").read_text())
          if not isinstance(manifest, dict) or manifest.get("digest") != pin or manifest.get("kind") != "runtime-capsule" or manifest.get("product") != "harry-dev":
              raise SystemExit("Capsule manifest identity invalid")
          if not isinstance(manifest.get("release"), str) or not re.fullmatch(r"v[0-9]+(?:\.[0-9]+)*", manifest["release"]):
              raise SystemExit("Capsule release identity invalid")
          source = manifest.get("source_sha")
          legacy = (manifest["release"] == "v1.1.2"
                    and pin == "fee4e7022707b4da7ab54651aaedadfcb78a21ce489521df6fef78c0f12fe962"
                    and source == "cfb522a")
          if not (isinstance(source, str) and re.fullmatch("[0-9a-f]{40}", source)) and not legacy:
              raise SystemExit("Capsule source SHA is neither exact nor the known legacy identity")
          out = root / "extracted"
          out.mkdir()
          with zipfile.ZipFile(root / "runtime.zip") as arc:
              seen = set()
              for info in arc.infolist():
                  path = pathlib.PurePosixPath(info.filename)
                  if path.is_absolute() or not path.parts or ".." in path.parts or "\\" in info.filename or info.filename in seen:
                      raise SystemExit("Unsafe capsule archive member")
                  seen.add(info.filename)
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode) or stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR):
                      raise SystemExit("Unsafe capsule member type")
                  target = out.joinpath(*path.parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(arc.read(info))
                      target.chmod(0o755 if mode & 0o111 else 0o644)
          candidates = list(out.rglob("scripts/ght-gha-adapter.sh"))
          if len(candidates) != 1:
              raise SystemExit("Runtime has no unique canonical GHT adapter")
          package = candidates[0].parent.parent
          for name in ("ght-gha-complete.sh", "ght-plan-publish.sh", "ght-gha-review-trigger.py", "ght-gha-review-verdict.py"):
              if not (package / "scripts" / name).is_file():
                  raise SystemExit(f"Required Runtime script missing: {name}")
          with open(__import__("os").environ["GITHUB_ENV"], "a") as env:
              print("GHT_RUNTIME_DIR=" + str(package), file=env)
          PY
          git update-ref -d "$tmpref"
          trap - EXIT

      - name: Publish authorized Plan
        env:
          GH_TOKEN: ${{ github.token }}
          GHT_PLAN_PUBLISHER_ID: ght-plan-publish-workflow
          GHT_PLAN_PATH: ${{ inputs.plan_path || 'docs/plans/current-plan.yaml' }}
          GHT_REPLACE_REVISION: ${{ inputs.replace_revision }}
        run: |
          set -euo pipefail
          sh "$GHT_RUNTIME_DIR/scripts/ght-gha-adapter.sh" plan-publish \
            "$GHT_PLAN_PATH" "$GHT_REPLACE_REVISION" | tee plan-publish-result.json

      - name: Publish outcome evidence
        if: always()
        run: |
          {
            echo "## Execution Plan publication"
            if [ -s plan-publish-result.json ]; then
              plan_id=$(jq -r '.plan_id' plan-publish-result.json)
              revision=$(jq -r '.revision' plan-publish-result.json)
              ref=$(jq -r '.ref' plan-publish-result.json)
              nodes=$(jq -r '.nodes' plan-publish-result.json)
              replaced=$(jq -r '.replaced // "first publish"' plan-publish-result.json)
              echo "- plan_id: \`$plan_id\`"
              echo "- published revision: \`$revision\`"
              echo "- ref: \`$ref\` ($nodes nodes, replaced: $replaced)"
            else
              echo "- publication FAILED — see the step log; no half-published pointer exists (CAS guarantees the previous revision stays current)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
