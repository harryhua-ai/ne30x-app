name: Release App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Repository release version (vX.Y.Z)'
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.5.2

      - name: Install ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Validate release version input
        run: |
          set -euo pipefail
          python3 package/release/release_tool.py validate-version \
            --version '${{ inputs.version }}'
          echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Resolve packaged versions from the Makefile
        run: |
          set -euo pipefail
          native=$(make -C apps/line-crossing/app -s print-v4_app_version)
          echo "PKG_DIR=apps/line-crossing/app/build/pkg" >> "$GITHUB_ENV"
          echo "PACKAGE=apps/line-crossing/app/build/pkg/line-crossing-$native.neapp" >> "$GITHUB_ENV"

      - name: Check tag and release conflicts (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 package/release/release_tool.py check-conflicts \
            --version "$RELEASE_VERSION" \
            --repo-slug '${{ github.repository }}'

      - name: Build production candidate package
        run: |
          set -euo pipefail
          bash package/release/build_neapp.sh --source-sha '${{ github.sha }}'

      - name: Generate English release notes
        run: |
          set -euo pipefail
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            range="$(git describe --tags --abbrev=0)..HEAD"
            git log --format='%s' "$range" > "$RUNNER_TEMP/commits.txt"
          else
            git log --format='%s' -n 50 > "$RUNNER_TEMP/commits.txt"
          fi
          python3 package/release/release_tool.py notes \
            --repo-version "$RELEASE_VERSION" \
            --provenance "$PACKAGE.provenance.json" \
            --verification "${PACKAGE%.neapp}.verification.json" \
            --known-limitations docs/release-known-limitations.md \
            --commits-file "$RUNNER_TEMP/commits.txt" \
            --out "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create unpublished draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(python3 package/release/release_tool.py create-draft \
            --version "$RELEASE_VERSION" \
            --target-sha '${{ github.sha }}' \
            --title "line-crossing $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --assets "$PACKAGE" "$PACKAGE.sha256" \
                     "$PACKAGE.provenance.json" \
                     "${PACKAGE%.neapp}.verification.json")
          echo "Draft release created (not published): $url"
          echo "Publishing requires a separate per-version User Release GO."
